<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Creeper pixelisé</title>
  <desc id="desc">Mascotte verte en blocs, inspirée du Creeper de Minecraft.</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#83d66a" />
      <stop offset="0.55" stop-color="#55ae54" />
      <stop offset="1" stop-color="#347d47" />
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#69bd5b" />
      <stop offset="0.56" stop-color="#4d9c4e" />
      <stop offset="1" stop-color="#2e6e41" />
    </linearGradient>
    <pattern id="pixel-noise" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0h12v9H0zM20 3h12v13H20zM9 21h11v11H9z" fill="#b8e786" opacity=".15" />
      <path d="M12 10h8v11h-8zM0 23h8v9H0zM23 20h9v9h-9z" fill="#143e2d" opacity=".13" />
    </pattern>
    <filter id="pixel-shadow" x="-30%" y="-15%" width="170%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#05070a" flood-opacity=".62" />
    </filter>
  </defs>
  <ellipse cx="110" cy="307" rx="75" ry="10" fill="#05070a" opacity=".55" />
  <g filter="url(#pixel-shadow)" stroke="#214d34" stroke-width="3" stroke-linejoin="round">
    <!-- Two block legs -->
    <path d="M59 236h46v66H59z" fill="url(#torso)" />
    <path d="M115 236h46v66h-46z" fill="url(#torso)" />
    <path d="M59 236h46v66H59zM115 236h46v66h-46z" fill="url(#pixel-noise)" stroke="none" />
    <path d="M67 286h30v16H67zM123 286h30v16h-30z" fill="#326f42" opacity=".8" stroke="none" />

    <!-- Torso -->
    <path d="M59 127h102v112H59z" fill="url(#torso)" />
    <path d="M59 127h102v112H59z" fill="url(#pixel-noise)" stroke="none" />
    <path d="M63 132h14v89H63z" fill="#a5df72" opacity=".18" stroke="none" />
    <path d="M143 132h14v102h-14z" fill="#173b2b" opacity=".2" stroke="none" />
    <path d="M86 154h17v13H86zM118 185h25v14h-25zM72 204h18v14H72z" fill="#a8df76" opacity=".22" stroke="none" />

    <!-- Square head -->
    <path d="M41 18h138v113H41z" fill="url(#head)" />
    <path d="M41 18h138v113H41z" fill="url(#pixel-noise)" stroke="none" />
    <path d="M46 23h16v96H46z" fill="#d0ee8c" opacity=".17" stroke="none" />
    <path d="M158 23h16v103h-16z" fill="#153d2c" opacity=".2" stroke="none" />
    <path d="M71 31h18v13H71zM129 99h25v14h-25zM97 22h16v12H97z" fill="#c0e87e" opacity=".24" stroke="none" />

    <!-- Classic blocky face -->
    <g fill="#14251e" stroke="none">
      <path d="M66 52h25v21H66zM129 52h25v21h-25z" />
      <path d="M91 73h38v19H91zM78 92h64v20H78zM98 112h25v11H98z" />
    </g>
  </g>
</svg>
