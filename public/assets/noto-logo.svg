<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1210" width="880" height="1210" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="border" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1de9f6"/><stop offset="0.5" stop-color="#22c4f5"/><stop offset="1" stop-color="#1e88f0"/></linearGradient>
<linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22b8ee"/><stop offset="1" stop-color="#1de6f4"/></linearGradient>
<radialGradient id="bg" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#101a3c"/><stop offset="1" stop-color="#0d1129"/></radialGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22b8ff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#1c6fe0" stop-opacity="0.25"/><stop offset="1" stop-color="#1c6fe0" stop-opacity="0"/></radialGradient>
<radialGradient id="sphere" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d4faff"/><stop offset="0.35" stop-color="#5fd6f7"/><stop offset="0.75" stop-color="#2a9bea"/><stop offset="1" stop-color="#1f7ad8"/></radialGradient>
<radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff"/><stop offset="0.5" stop-color="#e8fdff" stop-opacity="0.9"/><stop offset="1" stop-color="#a5f0ff" stop-opacity="0"/></radialGradient>
<clipPath id="sc"><circle cx="440" cy="530" r="125"/></clipPath>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- Card -->
<rect x="27" y="112" width="826" height="1012" rx="165" fill="url(#bg)" stroke="url(#border)" stroke-width="20" filter="url(#glow)"/>
<!-- Halo -->
<circle cx="440" cy="530" r="260" fill="url(#halo)"><animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/></circle>
<!-- Dashed orbit -->
<g>
<circle cx="440" cy="558" r="308" fill="none" stroke="#2e3f7c" stroke-width="16" stroke-dasharray="44 30"/>
<animateTransform attributeName="transform" type="rotate" from="0 440 558" to="-360 440 558" dur="60s" repeatCount="indefinite"/>
</g>
<!-- Purple dots -->
<g>
<circle cx="135" cy="551" r="17" fill="#a855f7"/>
<circle cx="747" cy="551" r="17" fill="#a855f7"/>
<animateTransform attributeName="transform" type="rotate" from="0 440 551" to="360 440 551" dur="14s" repeatCount="indefinite"/>
</g>
<!-- Sparkles -->
<g fill="#5fb8ff">
<circle cx="511" cy="300" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="310" cy="329" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="288" cy="372" r="3"/>
<circle cx="229" cy="438" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="199" cy="478" r="3"/>
<circle cx="629" cy="415" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
<circle cx="643" cy="494" r="4"/>
<circle cx="690" cy="640" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="634" cy="685" r="4"/>
<circle cx="259" cy="682" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
<circle cx="550" cy="743" r="3"/>
<circle cx="333" cy="796" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
<circle cx="490" cy="801" r="4"/>
</g>
<!-- Ring -->
<g transform="rotate(-25 440 560)">
<ellipse cx="440" cy="560" rx="330" ry="100" fill="none" stroke="url(#ring)" stroke-width="20" filter="url(#glow)"/>
<animateTransform attributeName="transform" additive="sum" type="rotate" values="0 440 560;4 440 560;0 440 560;-4 440 560;0 440 560" dur="10s" repeatCount="indefinite"/>
</g>
<!-- Sphere -->
<circle cx="440" cy="530" r="125" fill="url(#sphere)"/>
<g clip-path="url(#sc)" fill="#1a78d8" opacity="0.85">
<path d="M330 470 C360 450 375 480 355 500 C380 520 350 545 365 570 C340 600 320 560 330 470Z"/>
<path d="M350 600 C380 590 395 620 430 640 C400 665 355 650 350 600Z"/>
<path d="M520 640 C545 620 560 590 575 560 C590 620 560 660 520 640Z"/>
<path d="M480 420 C510 415 535 440 540 465 C510 455 495 445 480 420Z"/>
<path d="M370 440 C400 425 415 430 425 450 C400 445 385 450 370 440Z"/>
</g>
<circle cx="440" cy="530" r="125" fill="none" stroke="#2a8de6" stroke-width="4" opacity="0.6"/>
<!-- Sphere covers ring back-arc -->
<g clip-path="url(#sc)"><circle cx="440" cy="530" r="125" fill="url(#sphere)" opacity="0"/></g>
<!-- Star -->
<g transform="translate(440 530)"><g>
<g transform="translate(-440 -530)"><ellipse cx="440" cy="545" rx="70" ry="80" fill="url(#core)" filter="url(#soft)"/>
<path d="M440 392 C446 470 470 510 572 521 C500 535 470 560 440 600 C410 560 380 535 310 521 C410 510 434 470 440 392Z" fill="#f4feff" filter="url(#glow)"/>
<path d="M440 545 C395 540 385 600 440 655 C495 600 485 540 440 545Z" fill="#dff9ff" opacity="0.9"/>
<path d="M440 590 C425 600 425 625 440 645 C455 625 455 600 440 590Z" fill="#7ad6f7" opacity="0.7"/></g>
<animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" keyTimes="0;.5;1"/>
</g></g>
</svg>
